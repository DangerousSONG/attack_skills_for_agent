name: skill-base-sync

# main 上的 skill 底座（见 SYNC-RULES.md 第一节）变更后，
# 自动向各方案分支开同步 PR。方案分支负责人合并；
# 冲突 = 有人在方案分支直接改了底座（违反 SYNC-RULES 铁律 1/2），以 main 为准。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Anthropic-Cybersecurity-Skills/**'
      - 'Claude-OSINT/**'
      - 'Claude-Red-pentest-set/**'
      - 'awesome-ai-security/**'
      - 'awesome-web3-security/**'
      - 'ctf-skills/**'
      - 'hack-skills/**'
      - 'offensive-claude/**'
      - 'pentest-ai-agents/**'
      - 'yak-skills/**'
      - 'tool-skills/**'
      - 'extra-skill/**'
      - 'INDEX.md'
      - '攻击侧Skills清单.csv'
      - 'SYNC-RULES.md'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [rfc-audit-skills, static-router, flat-skills, song_1030]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: 合并 main 进方案分支
        id: merge
        run: |
          git config user.name "skill-base-sync[bot]"
          git config user.email "skill-base-sync[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge origin/main --no-edit; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            git merge --abort || true
            exit 0
          fi
          # 合并后与方案分支无差异（快进/已同步）→ 无事可做
          if git diff --quiet ${{ matrix.branch }}; then
            echo "merged=noop" >> "$GITHUB_OUTPUT"
          else
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 无冲突 → 开同步 PR
        if: steps.merge.outputs.merged == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto-sync/skill-base-${{ matrix.branch }}
          base: ${{ matrix.branch }}
          delete-branch: true
          title: "sync: skill 底座同步 ← main → ${{ matrix.branch }}"
          body: |
            main 上的 skill 底座（SYNC-RULES.md 第一节范围）已更新，本 PR 将底座变更合并进 `${{ matrix.branch }}`。

            - 方案层文件（README / router / rfc-audit-skills 等）不受影响
            - 如本 PR 出现底座路径冲突：说明有人在方案分支直接改了底座（违反 SYNC-RULES 铁律 1/2），**一律以 main 为准**，请把改动重做到 main 后重新同步
            - 规则全文见 [SYNC-RULES.md](https://github.com/${{ github.repository }}/blob/main/SYNC-RULES.md)

      - name: 有冲突 → 提 issue 提醒
        if: steps.merge.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "底座同步冲突：main → ${{ matrix.branch }}" \
            --body "main 的 skill 底座变更无法干净合并进 \`${{ matrix.branch }}\`。按 [SYNC-RULES.md](https://github.com/${{ github.repository }}/blob/main/SYNC-RULES.md) 铁律 2：底座路径冲突一律以 main 为准，请把方案分支上的底座改动重做到 main 后重新同步。触发 commit：${{ github.event.head_commit.url }}"
