name: skill-base-sync

# main 上的 skill 底座（见 SYNC-RULES.md 第一节）变更后，
# 自动向各方案分支开同步 PR。方案分支负责人合并。
# 冲突分流（对应 SYNC-RULES 两条铁律）：
#   底座路径冲突 → 以 main 为准（铁律 2：方案分支不得改底座）；
#   方案层冲突   → 以方案分支为准（铁律 3：方案层互不同步），
#   全库合并时最常见的冲突就是各分支自己的 router/README，属此类，自动消解后继续开 PR。
# 只有连"取 main 版底座"都无法完成的异常（如文件名带空格/二进制冲突）才转 issue。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Anthropic-Cybersecurity-Skills/**'
      - 'Claude-OSINT/**'
      - 'Claude-Red-pentest-set/**'
      - 'awesome-ai-security/**'
      - 'awesome-web3-security/**'
      - 'ctf-skills/**'
      - 'hack-skills/**'
      - 'offensive-claude/**'
      - 'pentest-ai-agents/**'
      - 'yak-skills/**'
      - 'tool-skills/**'
      - 'extra-skill/**'
      - 'INDEX.md'
      - '攻击侧Skills清单.csv'
      - 'SYNC-RULES.md'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [rfc-audit-skills, static-router, flat-skills, song_1030]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: 合并 main 进方案分支
        id: merge
        run: |
          # GitHub Actions 默认 bash -eo pipefail；冲突消解需要对失败命令逐一处理，关掉 -e
          set +e
          git config user.name "skill-base-sync[bot]"
          git config user.email "skill-base-sync[bot]@users.noreply.github.com"
          git fetch origin main

          # 底座路径正则（与 SYNC-RULES.md 第一节一致）；命中即铁律 2 范围
          BASE_RE='^(Anthropic-Cybersecurity-Skills|Claude-OSINT|Claude-Red-pentest-set|awesome-ai-security|awesome-web3-security|ctf-skills|hack-skills|offensive-claude|pentest-ai-agents|yak-skills|tool-skills|extra-skill)/|^INDEX\.md$|^攻击侧Skills清单\.csv$'

          if git merge origin/main --no-edit; then
            # 合并后与方案分支无差异（快进/已同步）→ 无事可做
            if git diff --quiet ${{ matrix.branch }}; then
              echo "merged=noop" >> "$GITHUB_OUTPUT"
            else
              echo "merged=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # ---- 有冲突：按路径分流消解 ----
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          BASE_CONFLICTS=$(echo "$CONFLICTS" | grep -E "$BASE_RE" || true)
          PLAN_CONFLICTS=$(echo "$CONFLICTS" | grep -vE "$BASE_RE" || true)

          if [ -n "$BASE_CONFLICTS" ]; then
            echo "底座路径冲突（铁律2取main版）: $BASE_CONFLICTS" >&2
            echo "$BASE_CONFLICTS" | while IFS= read -r f; do
              git checkout --theirs -- "$f" && git add -- "$f" || echo "  [警告] 底座冲突消解失败: $f" >&2
            done || true
          fi
          if [ -n "$PLAN_CONFLICTS" ]; then
            echo "方案层冲突（取本分支版）: $PLAN_CONFLICTS" >&2
            echo "$PLAN_CONFLICTS" | while IFS= read -r f; do
              # modify/delete 型冲突（如 flat-skills 删了 engagement-discipline）：本分支版不存在则直接 add 登记删除
              git checkout --ours -- "$f" 2>/dev/null || git rm -q -- "$f" 2>/dev/null || echo "  [警告] 方案层冲突消解失败: $f" >&2
              git add -- "$f" 2>/dev/null
            done || true
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            # 仍有未消解冲突（异常情况）→ 转 issue
            git merge --abort || true
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit --no-edit
          if git diff --quiet ${{ matrix.branch }}; then
            echo "merged=noop" >> "$GITHUB_OUTPUT"
          else
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 无冲突 → 开同步 PR
        if: steps.merge.outputs.merged == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto-sync/skill-base-${{ matrix.branch }}
          base: ${{ matrix.branch }}
          delete-branch: true
          title: "sync: skill 底座同步 ← main → ${{ matrix.branch }}"
          body: |
            main 上的 skill 底座（SYNC-RULES.md 第一节范围）已更新，本 PR 将底座变更合并进 `${{ matrix.branch }}`。

            - 方案层文件（README / router / rfc-audit-skills 等）不受影响
            - 如本 PR 出现底座路径冲突：说明有人在方案分支直接改了底座（违反 SYNC-RULES 铁律 1/2），**一律以 main 为准**，请把改动重做到 main 后重新同步
            - 规则全文见 [SYNC-RULES.md](https://github.com/${{ github.repository }}/blob/main/SYNC-RULES.md)

      - name: 有冲突 → 提 issue 提醒
        if: steps.merge.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "底座同步冲突：main → ${{ matrix.branch }}" \
            --body "main 的 skill 底座变更无法干净合并进 \`${{ matrix.branch }}\`。按 [SYNC-RULES.md](https://github.com/${{ github.repository }}/blob/main/SYNC-RULES.md) 铁律 2：底座路径冲突一律以 main 为准，请把方案分支上的底座改动重做到 main 后重新同步。触发 commit：${{ github.event.head_commit.url }}"
